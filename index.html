<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Unity Games</title>
  <style>
    body {
      font-family: sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header { text-align: center; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 160px; object-fit: cover; background: #ddd; }
    .card-body { padding: 15px; }
    .card-title { font-size: 1.2em; font-weight: bold; margin: 0 0 10px; }
    .card-desc { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    .btn { display: inline-block; padding: 8px 16px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.9em; }
    .btn:hover { background: #0056b3; }
  </style>
</head>
<body>

<header>
  <h1>制作ゲーム一覧</h1>
  <p>Unityで作成したゲームをまとめています。</p>
</header>

<div class="grid">
  <!-- ゲーム1 -->
  <div class="card">
    <img src="RPG_Game_klick.png" alt="ゲーム1の画像">
    <div class="card-body">
      <div class="card-title">RPG_GAME_KLICK</div>
      <div class="card-desc">RPGゲーム作成中です！！</div>
      <a href="https://play.unity.com/en/games/8fd3b96e-f2af-4305-a014-baee0b7fa689/rpggameklick" class="btn" target="_blank">プレイする</a>
    </div>
  </div>

  <!-- ゲーム2 -->
  <div class="card">
    <img src="Draw_Line_klick.png" alt="ゲーム2の画像">
    <div class="card-body">
      <div class="card-title">Draw_Line_klick</div>
      <div class="card-desc">線を描いてゴールの箱にボールを入れるゲームです。</div>
      <a href="https://play.unity.com/api/v1/games/game/13a4cd77-a0e3-4533-befd-0a26613b44c8/build/latest/frame" class="btn" target="_blank">プレイする</a>
    </div>
  </div>

  <!-- ゲーム2 -->
  <div class="card">
    <img src="Quiz_Game_klick.png" alt="ゲーム2の画像">
    <div class="card-body">
      <div class="card-title">クイズゲーム_klick</div>
      <div class="card-desc">簡単な英語クイズゲームです。</div>
      <a href="https://play.unity.com/api/v1/games/game/7e63dadd-25a5-42f0-99cf-81b2ffd48a50/build/latest/frame" class="btn" target="_blank">プレイする</a>
    </div>
  </div>
</div>

</body>
</html>
